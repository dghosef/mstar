# As qwen3_8_27b_tp4.yaml, with the KV pool sized for long-video concurrency.
# Qwen3.8-27B served by the Qwen3.5 model code (same architecture), for the
# video benchmark on this branch: `configs/qwen3_5_27b_tp4.yaml` pointed at the
# Qwen3.8 checkpoint.
model: "qwen3_5_27b"
model_kwargs:
  model_path_hf: "Qwen/Qwen3.8-27B"
max_seq_len: 32768
node_groups:
  - node_names: [vision_encoder]
    ranks: [0]
  - node_names: [LLM]
    ranks: [0, 1, 2, 3]
    tp_size: 4

resources:
  gdn_state:
    max_slots: 129
  kv_cache:
    # 8192 x 128-token pages = 1M tokens, ~16 GiB per GPU at TP4; the 2048
    # default (262k tokens, ~4 GiB) runs out at 32 long-video requests
    max_num_pages: 8192

warmup_requests:
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/example_action_fd_umi_first_frame.png]
    model_kwargs: {max_output_tokens: 4}
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/edge_action_id_av_0_output.png]
    model_kwargs: {max_output_tokens: 4}
