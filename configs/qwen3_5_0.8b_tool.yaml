# Qwen3.5 0.8B whose replies may run Python: the model writes a <tool_call>, a Router and a Tool node on a rank
# of their own run the code, and the reply continues from the result (until it answers, or its output budget
# ends). The code is whatever the model writes and runs on this host with no network or filesystem
# isolation, so serve this only where every caller is trusted.
model: "qwen3_5_0.8b"
model_kwargs:
  tools: [python]
# The Router/Tool rank shares the GPU: it runs no CUDA work.
rank_devices: {1: 0}
max_seq_len: 32768
# Raise the gen-0 GC threshold: at CPython's 700 a 128-row decode step
# collects almost every step and runs a full collection every few hundred.
knobs:
  gc_gen0_threshold: 50000
node_groups:
  # Text, images and video. Colocated: the
  # encoder runs once per request, then idles.
  - node_names: [LLM, vision_encoder]
    ranks: [0]
  - node_names: [Router, Tool]
    ranks: [1]
resources:
  gdn_state:
    max_slots: 129
    # GDN state snapshots at page boundaries for the prefix cache, kept across requests and
    # evicted oldest first, replies before prompts. A prefill keeps up to two, plus one per
    # chunk the step budget cuts (each earlier one evicted first), and each takes a request
    # slot's memory.
    prefix_slots: 128
    # state_dtype: bfloat16  # default: the checkpoint's mamba_ssm_dtype (float32)

# The vision regions compile at start-up; these two sizes (64 and 608 image
# tokens) warm two of the captured block loop's buckets and the LLM's vision
# prefill before the server binds.
warmup_requests:
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/example_action_fd_umi_first_frame.png]
    model_kwargs: {max_output_tokens: 4}
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/edge_action_id_av_0_output.png]
    model_kwargs: {max_output_tokens: 4}
