model: "qwen3_omni"
max_seq_len: 32768
# qwen3omni_2gpu.yaml (for 141 GB H200-class GPUs) adapted to 80 GB GPUs such as the
# H100. The Thinker's GPU holds every prefill capture bucket, and beside a 1,024-page
# KV pool the larger buckets don't fit, so a step that size would run eagerly. 512
# pages leave room for all of them. Host pages give a full pool a request to move.
resources:
  thinker_kv:
    max_num_pages: 512
    cpu_offload_pages: 1024
node_groups:
  # The encoders run on the Talker's GPU (idle for text replies). Beside the Thinker
  # they shared its worker, so under load each encoder step waited behind a Thinker
  # step. The handoff across GPUs costs a little TTFT for a lone short request.
  - node_names: [audio_encoder, vision_encoder]
    ranks: [0]
  - node_names: [Thinker]
    ranks: [1]

  - node_names: [Talker]
    ranks: [0]

  - node_names: [Code2Wav]
    ranks: [0]
# A Thinker prefill row rides the speculated decode step instead of a step of
# its own (a prefill reads nearly every expert, as a decode step at 16+ rows does).
speculation_mixes_walks:
  Thinker: true
