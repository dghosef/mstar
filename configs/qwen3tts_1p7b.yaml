# Qwen3-TTS-12Hz-1.7B-CustomVoice: built-in speakers, optional style instruction (instruct=...)
# Same graph, pools and single-GPU placement as the 0.6B deployment
# (configs/qwen3tts.yaml), with a bf16 codec and a 4-frame first chunk. KV
# geometry is identical across sizes (28 layers, 8 KV heads, head_dim 128).
model: "qwen3_tts_1p7b"
max_seq_len: 32768
# bf16 codec decoder (its norm and RoPE arithmetic in fp32): ~1.9x a codec
# step's speed on an H200, within the WER/speaker gate on this checkpoint.
# Measured on H200 only: on a B300, main's windowed codec ran bf16 slower under
# cuDNN's heuristic conv picks, and this decoder has not been measured there;
# set codec_dtype: float32 on other GPUs until it is.
model_kwargs:
  codec_dtype: bfloat16
  # A 4-frame first chunk (320 ms of audio, three Talker steps later): with a
  # 1-frame one (80 ms) the next chunk arrived after the client had played it
  # under load, the one pause behind the misses near capacity. The 4/8/16
  # ramp holds 1.000 attainment through 80 req/s on Seed-TTS and 28 on the
  # passages (H200), for +30-60 ms TTFA.
  codec_chunk_schedule: [4, 8, 16]
# The supported deployment image cannot build FlashInfer's Hopper FA3 JIT
# kernels yet. Keep the model default on "auto" and pin this deployment to FA2.
# On B300 (sm_103) FA2 stays the decode backend too: trtllm-gen rebuilds its
# block table on every plan, which a captured decode replay does not see
# (wrong attention, then illegal memory accesses), and cudnn is faster up to
# 16 rows but slower at 32 and costs more host time per plan.
resources:
  talker_attn:
    flashinfer_backend: fa2
  # Default pools (2048 Talker KV pages, about 30 GB). On a GPU with 80 GB or
  # more, these overload-sized pools held up past saturation on an
  # H200 (78/86/91 done/s at 80/88/96 req/s, TTFA p99 89-222 ms, 70 GB peak),
  # where the default pools collapsed (9.8 done/s at 80 req/s). That was
  # measured before admission queued requests for KV pages and codec slots
  # instead of failing their admits, and is not re-measured since:
  #   talker_kv:
  #     max_num_pages: 4096
  #   codec_state:
  #     max_slots: 512
node_groups:
  - node_names: [Talker]
    ranks: [0]
    graph_walks: [talker_prefill, talker_decode]
  - node_names: [Codec]
    ranks: [0]
    graph_walks: [codec_chunk]
