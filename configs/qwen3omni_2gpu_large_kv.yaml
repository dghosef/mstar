model: "qwen3_omni"
max_seq_len: 32768
# qwen3omni_2gpu.yaml for H200-class GPUs with the Thinker's KV pool at its default
# 2,048 pages (24 GiB at 12 MiB a page) and no host pages. On 80 GB GPUs, serve
# qwen3omni_2gpu_h100.yaml.
node_groups:
  - node_names: [audio_encoder, vision_encoder]
    ranks: [1]
  - node_names: [Thinker]
    ranks: [1]
  
  - node_names: [Talker]
    ranks: [0]
  
  - node_names: [Code2Wav]
    ranks: [0]
# A Thinker prefill row rides the speculated decode step instead of a step of
# its own (a prefill reads nearly every expert, as a decode step at 16+ rows does).
speculation_mixes_walks:
  Thinker: true
