model: "qwen3_5_9b"
max_seq_len: 32768
# Speculate and pre-plan step N+1 of the TP LLM during step N, as single-GPU
# nodes do (see MSTAR_TP_ASYNC_SCHED); without it each step's schedule and
# plan run serially between the ranks' forwards.
tp_async_sched: true
# Raise the gen-0 GC threshold: at CPython's 700 a 128-row decode step
# collects almost every step and runs a full collection every few hundred.
# (kv_plan_cache measured neutral alone and -0.6..-2.5% beside this at c128.)
knobs:
  gc_gen0_threshold: 50000
# Captured text-prefill ladder (see docs/models.rst): the default powers of
# two plus 1152-1792, so a prompt just past 1024 tokens (1k of text plus its
# chat template) doesn't pad to 2048, and 3072-7168 for long packed prefills.
model_kwargs:
  prefill_token_buckets: [32, 64, 128, 256, 512, 1024, 1152, 1280, 1536, 1792, 2048, 3072, 4096, 5120, 6144, 7168, 8192]
node_groups:
  # Text, images and video. A vision encoder replica beside each LLM rank,
  # so the encoder steps that stall the lockstep LLM split over both ranks.
  - node_names: [vision_encoder]
    ranks: [0, 1]
  - node_names: [LLM]
    ranks: [0, 1]
    tp_size: 2

resources:
  gdn_state:
    max_slots: 129
    # state_dtype: bfloat16  # default: the checkpoint's mamba_ssm_dtype (float32)

# The vision encoder's embed and merger compile (dynamic) on the first image;
# these two sizes (64 and 608 image tokens) take that compile and warm two of
# the captured block loop's buckets before the server binds.
warmup_requests:
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/example_action_fd_umi_first_frame.png]
    model_kwargs: {max_output_tokens: 4}
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/edge_action_id_av_0_output.png]
    model_kwargs: {max_output_tokens: 4}
  # A packed text prefill past the top captured bucket (8192 tokens) runs the
  # LLM eager: its first shape compiles static and the next token count
  # recompiles the forward dynamic (~2 s with the batch waiting), so take both
  # before the server binds. Different texts, so neither hits a cached prefix.
  # Each spec runs (once alone, then) one copy set per encoder replica, so the
  # concurrencies are half the other configs' 6 and 12: the same 6 x ~2.7k and
  # 12 x ~1.6k packed prefills.
  - text: "The quick brown fox jumps over the lazy dog while the cat sleeps by the fire. "
    repeat: 150
    model_kwargs: {max_output_tokens: 2}
    concurrency: 3
  - text: "Pack my box with five dozen liquor jugs and send it to the harbor before noon. "
    repeat: 90
    model_kwargs: {max_output_tokens: 2}
    concurrency: 6
