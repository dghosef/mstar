model: "wan22"

# All wan22 nodes are STATELESS (no KV cache); max_seq_len only satisfies the
# conductor's config check and matches the UMT5 text length (512 tokens).
max_seq_len: 512

# The untiled VAE decode runs the shared Wan VAE decoder, compiled (1.74x faster
# decode at 1280x704 x 121 frames on an H200; 1.59x at 832x480 x 81). The compile
# is per output resolution, not frame count, about 20 s on an H200, so it runs
# only for the listed sizes, the 720p and 480p tiers here; any other size
# decodes with stock vae.decode. vae_decode_fast: false restores stock
# vae.decode everywhere.
model_kwargs:
  vae_decode_fast_sizes: ["1280x704", "832x480"]

# Wan2.2-TI2V-5B single-GPU colocated: all four nodes on rank 0.
node_groups:
  - node_names:
      - text_encoder
    ranks:
      - 0

  - node_names:
      - vae_encoder
      - vae_decoder
    ranks:
      - 0

  - node_names:
      - dit
    ranks:
      - 0
