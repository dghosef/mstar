model: "flux2_klein"

# Every klein node is stateless except the dit's cacheless ragged attention; max_seq_len
# only satisfies the conductor's config check (the 512-token prompt).
max_seq_len: 512

# FLUX.2 [klein] 4B, single GPU, all four nodes colocated. Serving knobs (forwarded to
# Flux2KleinModel.__init__): attention_backend fa3|sdpa|flashinfer, torch.compile of the
# transformer per shape, CUDA-graph capture of the denoise step for the listed
# (height, width) shapes and batch sizes (other shapes run the eager batched path).
#
# Shipped for speed, at the numerics level of the other engines rather than bit-exactness: served
# images land at a median 32-34 dB (min 22) from the reference-exact path at the same seeds, where
# SGLang's are at 23.8 dB (min 13.1). For reference-exact output set attention_backend: sdpa and
# compile_exact_ops: [norms] (-2.4..-3.2% images/s on an H100).
model_kwargs:
  # fa3: FlashAttention-3's dense kernel (Hopper only); sdpa (cuDNN) is the reference kernel
  attention_backend: fa3
  compile: true
  # inductor rounds intermediates where eager PyTorch does (and fuses no FMAs); on its own the compiled
  # transformer still lands at a median 37.6 dB from the eager path over the 100 protocol prompts (67 of 100 below 40 dB)
  compile_eager_rounding: true
  # op classes kept on the eager kernels inside the compiled forward. [norms] makes the compiled transformer
  # bit-exact with the eager one (every served image >= 53 dB from the eager path on all 100 protocol prompts,
  # the compiled VAE) at a latency cost; false is the plain compile
  compile_exact_ops: false
  accelerator_graph: true
  capture_sizes: [[1024, 1024]]
  # every batch size up to max_batch_size: a lockstep group of 5-7 requests would otherwise be padded into the 8-graph.
  # The text encoder captures its own geometric_batch_sizes: powers of two below max_batch_size, then max_batch_size
  # (one graph each)
  capture_batch_sizes: [1, 2, 3, 4, 5, 6, 7, 8]
  max_batch_size: 8
  # compiled VAE decode (max-autotune): 3x faster at 1024^2, ~56 dB from the eager decode; the autotuner may pick
  # other conv kernels in another server process (~64 dB apart). vae_compile: false for bit-exact, repeatable output
  vae_compile: true
  # async_scheduling (default true): the worker assembles the next denoise step while the current one runs and merges
  # newly ready requests into it; `false` = lockstep, within a few percent (see docs/models.rst)
  # LoRA adapters folded into the transformer at load (diffusers / PEFT or BFL-layout
  # safetensors; ``scale`` multiplies the adapter). Example:
  # lora:
  #   - {path: /path/to/klein-style.safetensors, scale: 0.8}

node_groups:
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_encoder, vae_decoder]
    ranks: [0]
  - node_names: [dit]
    ranks: [0]
