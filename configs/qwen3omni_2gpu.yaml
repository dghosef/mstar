model: "qwen3_omni"
max_seq_len: 32768
# For 141 GB H200-class GPUs. The Thinker's KV pool holds 1,024 GPU pages (128k tokens)
# plus 1,024 host pages that give a full pool a request to move. When concurrent requests
# hold more than 128k tokens of Thinker KV, serve qwen3omni_2gpu_large_kv.yaml, which
# keeps 2,048 pages (256k tokens) on the GPU and offloads nothing. On 80 GB GPUs such as
# the H100, serve qwen3omni_2gpu_h100.yaml.
resources:
  thinker_kv:
    max_num_pages: 1024
    cpu_offload_pages: 1024
node_groups:
  - node_names: [audio_encoder, vision_encoder]
    ranks: [1]
  - node_names: [Thinker]
    ranks: [1]
  
  - node_names: [Talker]
    ranks: [0]
  
  - node_names: [Code2Wav]
    ranks: [0]
# A Thinker prefill row rides the speculated decode step instead of a step of
# its own (a prefill reads nearly every expert, as a decode step at 16+ rows does).
speculation_mixes_walks:
  Thinker: true
