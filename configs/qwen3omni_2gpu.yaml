model: "qwen3_omni"
max_seq_len: 32768
# Sized for 80 GB GPUs. The Thinker's KV pool defaults to 2,048 pages, 24 GiB at
# 12 MiB a page, which doesn't fit beside its weights there, and its prefill ladder
# stays at the default 128-2048: beside this pool the 4096-8192 captures don't fit
# on an H100. qwen3omni_2gpu_large_kv.yaml keeps the default pool and runs the
# ladder to 8192 on H200-class GPUs. Host pages give a full pool a request to move.
resources:
  thinker_kv:
    max_num_pages: 1024
    cpu_offload_pages: 1024
node_groups:
  - node_names: [audio_encoder, vision_encoder]
    ranks: [1]
  - node_names: [Thinker]
    ranks: [1]
  
  - node_names: [Talker]
    ranks: [0]
  
  - node_names: [Code2Wav]
    ranks: [0]
# A Thinker prefill row rides the speculated decode step instead of a step of
# its own (a prefill reads nearly every expert, as a decode step at 16+ rows does).
speculation_mixes_walks:
  Thinker: true
